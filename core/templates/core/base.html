{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIOE - {% block title %}Sistema de Estudos{% endblock %}</title>
    <link rel="icon" href="{% static 'core/img/Logo.png' %}">
    <style>
        :root {
            --primary-color: {{ config.cor_primaria|default:'#2563eb' }};
            --primary-light: {{ config.cor_primaria|default:'#2563eb' }}20;
            --primary-dark: {{ config.cor_primaria|default:'#2563eb' }}80;
            
            --bg-body: #f0f4f9;
            --bg-card: #ffffff;
            --text-primary: #1a2a3a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --shadow: 0 4px 20px rgba(0,0,0,0.06);
            --shadow-hover: 0 12px 40px rgba(0,0,0,0.10);
        }
        
        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: #334155;
            --shadow: 0 4px 20px rgba(0,0,0,0.3);
            --shadow-hover: 0 12px 40px rgba(0,0,0,0.5);
        }
        
        [data-theme="blue"] {
            [data-theme="blue"] .card-theme,
[data-theme="blue"] .config-card,
[data-theme="blue"] .subject-card,
[data-theme="blue"] .goal-card,
[data-theme="blue"] .panel {
    background: rgba(26, 42, 58, 0.7) !important;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
}
    --bg-body: linear-gradient(135deg, #0f1a2a 0%, #1a2a3a 50%, #243b4f 100%);
    --bg-card: rgba(26, 42, 58, 0.85);
    --text-primary: #f0f4f9;
    --text-secondary: #8ab4d6;
    --text-muted: #4a7a9c;
    --border-color: #243b4f;
    --shadow: 0 4px 20px rgba(0,0,0,0.3);
    --shadow-hover: 0 12px 40px rgba(0,0,0,0.5);
    --glass-effect: rgba(255,255,255,0.05);
}
        
        body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-body);
    color: var(--text-primary);
    transition: background 0.3s ease, color 0.3s ease;
    min-height: 100vh;
    background-attachment: fixed;
}
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .messages { margin-bottom: 20px; }
        .message { padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; }
        .message-success { background: #dcfce7; color: #166534; }
        .message-error { background: #fee2e2; color: #991b1b; }
        .message-warning { background: #fef3c7; color: #92400e; }
        .message-info { background: #dbeafe; color: #1e40af; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body data-theme="{{ config.tema|default:'light' }}">
    <div class="container">
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="message message-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        
        {% block content %}{% endblock %}
    </div>
    
    <script>
        // Aplicar tema salvo no localStorage (para mudanças imediatas)
        document.addEventListener('DOMContentLoaded', function() {
            const temaSalvo = localStorage.getItem('sioe_tema');
            if (temaSalvo) {
                document.documentElement.setAttribute('data-theme', temaSalvo);
                document.body.setAttribute('data-theme', temaSalvo);
            }
        });
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
