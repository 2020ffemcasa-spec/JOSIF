{% extends 'core/base.html' %}

{% block title %}Login - SIOE{% endblock %}

{% block content %}
<div style="display:flex; justify-content:center; align-items:center; min-height:80vh;">
    <div style="background:white; padding:40px; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,0.1); width:100%; max-width:400px;">
        <h1 style="font-size:32px; color:#1a2a3a; margin-bottom:4px;">SIOE</h1>
        <p style="color:#8899aa; margin-bottom:30px;">Sistema de Organização de Estudos</p>
        
        <h2 style="font-size:24px; margin-bottom:4px;">Bem-vindo</h2>
        <p style="color:#8899aa; margin-bottom:30px;">Acesse sua conta</p>

        <form method="POST">
            {% csrf_token %}
            <div style="margin-bottom:16px;">
                <label style="display:block; margin-bottom:4px; font-weight:500;">E-mail</label>
                <input type="email" name="username" placeholder="seu.email@exemplo.com" style="width:100%; padding:12px; border:1.5px solid #e2e8f0; border-radius:8px; font-size:14px;" required>
            </div>
            <div style="margin-bottom:20px;">
                <label style="display:block; margin-bottom:4px; font-weight:500;">Senha</label>
                <input type="password" name="password" placeholder="••••••••" style="width:100%; padding:12px; border:1.5px solid #e2e8f0; border-radius:8px; font-size:14px;" required>
            </div>
            <button type="submit" style="width:100%; padding:14px; background:linear-gradient(135deg,#1a2a3a,#2c4458); color:white; border:none; border-radius:8px; font-size:16px; font-weight:600; cursor:pointer;">Entrar</button>
        </form>
        
        <p style="text-align:center; margin-top:20px; color:#8899aa;">
            Não possui conta? <a href="{% url 'core:cadastro' %}" style="color:#4a7a9c; text-decoration:none; font-weight:600;">Criar conta</a>
        </p>
    </div>
</div>
{% endblock %}
